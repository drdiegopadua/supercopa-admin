<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b2a8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supercopa Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Supercopa Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b1:#1b52e0;--b2:#0b2a8f;--b3:#071a5c;--ink:#0a1640;--mute:#6b7aa5;--ln:#dfe6f5;--bg:#f2f5fb;--card:#fff;--ok:#12a150;--okb:#e6f7ee;--er:#e5484d;--erb:#fdecec;--wa:#b7791f;--wab:#fff4dc;--soft:#e8efff;--display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Barlow','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1230;--card:#111c46;--ink:#eaf0ff;--mute:#93a4d6;--ln:#22306b;--soft:#1a2760;--okb:#0f3a2a;--erb:#431a22;--wab:#43330f}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--b1)}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.4px;line-height:1}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--b1),var(--b2) 60%,var(--b3));position:relative;overflow:hidden}
#login::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px}
.lbox{position:relative;width:100%;max-width:380px;color:#fff}
.lbox img{width:96px;display:block;margin-bottom:18px}
.lbox h1{font-size:50px;font-weight:800;margin-bottom:6px}.lbox h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px #fff}
.lbox p{color:#dbe6ff;margin-bottom:22px}
.lbox input[type=text],.lbox input[type=password]{width:100%;padding:15px;margin-bottom:10px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:17px;outline:0;border-radius:0}
.lbox input::placeholder{color:#b9c9f5}.lbox input:focus{border-color:#fff}
.lbox label{display:flex;gap:8px;align-items:center;font-size:14px;color:#dbe6ff;margin:4px 0 14px}
.lerr{min-height:20px;margin-bottom:6px;color:#ffd0d3;font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border:0;background:var(--b1);color:#fff;font:800 18px var(--display);text-transform:uppercase;letter-spacing:.8px;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.w{width:100%}.btn.wh{background:#fff;color:var(--b2)}
.btn.gh{background:var(--card);color:var(--b1);box-shadow:inset 0 0 0 2px var(--b1)}
.btn.er{background:var(--er)}.btn.sm{padding:9px 13px;font-size:15px}
.btn[disabled]{opacity:.55;pointer-events:none}
/* shell */
#app{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(160deg,var(--b1),var(--b2) 70%,var(--b3));color:#fff}
.top img{width:34px;height:34px;object-fit:contain}
.top h1{font-size:25px;font-weight:800;flex:1}
.top small{display:block;font:600 11px var(--body);letter-spacing:2px;text-transform:uppercase;color:#bcd0ff;margin-top:3px}
.ib{width:38px;height:38px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:0;color:#fff}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{max-width:1100px;margin:0 auto;padding:16px}
.tab{display:none;animation:in .4s cubic-bezier(.2,.9,.2,1) both}.tab.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--ln);box-shadow:0 -8px 24px -12px rgba(11,42,143,.3)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;background:none;border:0;color:var(--mute);font:700 10.5px var(--body);letter-spacing:1px;text-transform:uppercase}
.nav svg{width:23px;height:23px}
.nav button.on{color:var(--b1)}
.nav button.on svg{transform:translateY(-2px)}
@media (min-width:900px){#app{padding-bottom:0;padding-left:200px}.nav{top:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;padding:90px 12px 12px;border:0;border-right:1px solid var(--ln);box-shadow:none}.nav button{flex:none;flex-direction:row;gap:12px;padding:12px;font-size:13px}}
/* blocos */
.sec{margin:20px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:24px;color:var(--b2)}.sec small{color:var(--mute);font-size:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sec h2{color:#cfe0ff}}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kp{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.card{background:var(--card);border:1.5px solid var(--ln);padding:16px}
.card h3{font-size:19px;color:var(--b2);margin-bottom:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .card h3{color:#cfe0ff}}
.kpi{padding:14px 12px;text-align:center}
.kpi b{display:block;font:800 36px/1 var(--display);color:var(--b1)}
.kpi small{display:block;margin-top:5px;font:700 10.5px var(--body);letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.kpi i{display:block;font:600 12px var(--body);font-style:normal;color:var(--mute);margin-top:3px}
.al{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;margin-bottom:8px;border-left:5px solid;font-size:14.5px}
.al.er{background:var(--erb);border-color:var(--er)}.al.wa{background:var(--wab);border-color:#e0a21a}.al.ok{background:var(--okb);border-color:var(--ok)}.al.in{background:var(--soft);border-color:var(--b1)}
.al b{display:block;font:800 17px var(--display);text-transform:uppercase;letter-spacing:.4px}
.lst{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}.row:first-child{border:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:700;word-break:break-word}.row .t small{color:var(--mute);font-size:13px}
.pill{padding:3px 9px;font:800 12px var(--display);letter-spacing:.8px;text-transform:uppercase;background:var(--soft);color:var(--b1)}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.er{background:var(--erb);color:var(--er)}.pill.wa{background:var(--wab);color:var(--wa)}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f span{font:700 11px var(--body);letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.f input,.f select,.f textarea{width:100%;padding:12px;border:2px solid var(--ln);background:var(--card);outline:0;border-radius:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--b1)}
.f textarea{min-height:110px;resize:vertical}
.fr{display:grid;grid-template-columns:90px 1fr;gap:10px}
.chk{display:flex;gap:9px;align-items:center;margin:2px 0 14px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--b1)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:7px 12px;border:1.5px solid var(--ln);background:var(--card);font:600 13px var(--body)}
.mut{color:var(--mute);font-size:13.5px}
.empty{padding:20px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:99;padding:12px 18px;background:var(--ink);color:var(--bg);font-weight:600;max-width:90vw;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.er{background:var(--er);color:#fff}
.ld{display:inline-block;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--b1);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
.hlt{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:12px;color:#fff;background:var(--ok)}
.hlt.wa{background:#d99a14}.hlt.er{background:var(--er)}.hlt b{font:800 26px var(--display);text-transform:uppercase}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--mute)}.dot.ok{background:var(--ok)}.dot.wa{background:#e0a21a}.dot.er{background:var(--er)}
.cd{display:flex;gap:10px;margin:2px 0}.cd div{flex:1;text-align:center;background:var(--soft);padding:10px 4px}.cd b{display:block;font:800 30px/1 var(--display);color:var(--b1)}.cd small{font:700 10px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--mute)}
/* gráficos */
.nmc{display:block;width:100%;height:auto;overflow:visible}.nmg{stroke:var(--ln)}
.nmb{fill:#7497f3;transform-box:fill-box;transform-origin:50% 100%;animation:gr .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--d,0ms)}.nmb.hi{fill:#1b52e0}.nmb.app{fill:#0b2a8f}
@keyframes gr{from{transform:scaleY(0)}}
.nmv{font:700 14px var(--display);fill:var(--ink)}.nml{font:600 11.5px var(--body);fill:var(--mute)}
.nmar{fill:rgba(27,82,224,.14)}.nmln{fill:none;stroke:#1b52e0;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.nmdot{fill:var(--card);stroke:#1b52e0;stroke-width:3}
.nmh{display:flex;flex-direction:column;gap:12px}.nmhr{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:end}.nmhr span{font-size:14px}.nmhr b{font:800 19px var(--display);color:var(--b1)}.nmht{grid-column:1/-1;height:10px;background:var(--soft)}.nmht i{display:block;height:100%;background:var(--b1);transform-origin:left;animation:gx 1s cubic-bezier(.2,.9,.2,1) both}@keyframes gx{from{transform:scaleX(0)}}
.leg{display:flex;gap:14px;margin-top:6px;font-size:12.5px;color:var(--mute)}.leg i{display:inline-block;width:11px;height:11px;margin-right:5px;background:#7497f3}.leg i.app{background:#0b2a8f}
.nmdn{width:130px;height:130px}.nmdb{fill:none;stroke:var(--soft);stroke-width:18}.nmds{fill:none;stroke-width:18}.nmds.s0{stroke:#7497f3}.nmds.s1{stroke:#0b2a8f}.nmds.s2{stroke:#12a150}.nmdt{font:800 22px var(--display);fill:var(--ink)}
.dw{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<section id="login">
 <form class="lbox" id="lf" autocomplete="on">
  <img src="logo-branco.png" alt="Supercopa AFC">
  <h1>Supercopa<br><em>Admin</em></h1>
  <p>Área restrita da organização do torneio.</p>
  <input type="text" id="lu" name="username" placeholder="Usuário" autocomplete="username" autocapitalize="none" required>
  <input type="password" id="lp" name="password" placeholder="Senha" autocomplete="current-password" required>
  <label><input type="checkbox" id="lk"> Manter conectado neste aparelho</label>
  <div class="lerr" id="le"></div>
  <button class="btn wh w" id="lb" type="submit">Entrar</button>
 </form>
</section>

<div id="app" class="hide">
 <header class="top"><img src="logo-branco.png" alt=""><h1 id="tt">Painel<small id="ts"></small></h1>
  <button class="ib" id="rf" title="Atualizar" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
  <button class="ib" id="lo" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button>
 </header>
 <main>
  <section class="tab on" id="t-painel"></section>
  <section class="tab" id="t-noticias"></section>
  <section class="tab" id="t-push"></section>
  <section class="tab" id="t-saude"></section>
  <section class="tab" id="t-premios"></section>
  <section class="tab" id="t-mais"></section>
 </main>
 <nav class="nav" id="nav"></nav>
</div>
<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
